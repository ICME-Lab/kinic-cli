[package]
name = "kinic-cli"
version = "0.1.2"
edition = "2024"
rust-version = "1.86"
description = "CLI and terminal UI for operating Kinic memory canisters"
license = "MIT"
repository = "https://github.com/ICME-Lab/kinic-cli"
readme = "README.md"
keywords = ["kinic", "internet-computer", "cli", "tui"]
categories = ["command-line-utilities"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/docs/cli.md",
    "/docs/tui.md",
    "/docs/crates-io.md",
    "/docs/images/**",
    "/rust/**/*.rs",
    "/rust/commands/ii_login_page.html",
    "/crates/kinic-core/src/**/*.rs",
    "/tui/crates/tui-kit-model/src/**/*.rs",
    "/tui/crates/tui-kit-runtime/src/**/*.rs",
    "/tui/crates/tui-kit-host/src/**/*.rs",
    "/tui/crates/tui-kit-render/src/**/*.rs",
    "/tests/**/*.rs",
    "/tests/fixtures/**",
]

[dependencies]
anyhow = "1.0.100"
axum = "0.7.9"
candid = "0.10.20"
clap = { version = "4.5.51", features = ["derive"] }
hex = "0.4.3"
ic-agent = { version = "0.44.3", features = ["ring"] }
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "linux-native",
    "sync-secret-service",
    "vendored",
] }
pem = "3.0.6"
# security-framework = "3.5.1"
# security-framework-sys = "2.15.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros"] }
tokio-util = "0.7"
icrc-ledger-types = "0.1.12"
serde = { version =  "1.0", features = ["derive"] }
schemars = "1.2.1"
thiserror = "2.0.17"
reqwest = { version = "0.12.7", default-features = false, features = ["json", "rustls-tls"] }
dotenvy = "0.15.7"
serde_json = "1.0.145"
rmcp = { version = "0.5.0", features = ["server", "transport-io"] }
crossterm = "0.28"
dirs = "6"
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py38"], optional = true }
pdf-extract = "0.8"
gag = "1.0"
ring = "0.17.14"
der = "0.7.10"
pkcs8 = "0.10.2"
ic-ed25519 = "0.2.0"
fastembed = { version = "5.13.2", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
fuzzy-matcher = "0.3"
ratatui = "0.29"
ratatui-textarea = "0.8"
serde_yaml = "0.9"
tempfile = "3"
unicode-width = "0.2"
webbrowser = "0.8"

[dev-dependencies]
tower = "0.5"

[features]
default = []
python-bindings = ["pyo3"]
experimental = []

[lib]
name = "_lib"
path = "rust/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "kinic-cli"
path = "rust/cli.rs"

[workspace]
members = ["."]
default-members = ["."]
resolver = "3"
